# PostgreSQL local pour le développement : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: naera
      POSTGRES_PASSWORD: naera
      POSTGRES_DB: naera
    ports:
      - "5432:5432"
    volumes:
      - naera-db:/var/lib/postgresql/data

volumes:
  naera-db:
